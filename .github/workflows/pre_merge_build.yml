name: pre_merge_build
run-name: Pre Merge Build ${{ github.event.pull_request.number != '' && github.event.pull_request.number || '' }}

on:
  workflow_dispatch:
    inputs:
      testplan:
        description: 'Test plan name to use in job generation (lava-test-plans)'
        required: false
        type: string
        default: 'pre-merge'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths-ignore:
      - '.github/**'

jobs:
  load_parameters:
    uses: ./.github/workflows/loading.yml

  flat_build:
    needs: load_parameters
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      build_matrix: ${{ needs.load_parameters.outputs.build_matrix }}
      build_type: flat_build

  filter_test_matrix:
    needs: load_parameters
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.filter.outputs.test_matrix }}
    steps:
      - id: filter
        shell: bash
        run: |
          MATRIX='${{ needs.load_parameters.outputs.build_matrix }}'
          echo "RAW build_matrix:"
          echo "$MATRIX"
          echo "Validating JSON..."
          echo "$MATRIX" | jq . >/dev/null

          FILTERED=$(
            echo "$MATRIX" | jq -c '
            if type == "object" then
              to_entries
              | map(select(.value.testing_enabled == true))
              | from_entries
            elif type == "array" then
              map(select(.testing_enabled == true))
            else
              error("Unsupported build_matrix JSON type: " + (type|tostring))
            end
            '
          )

          echo "Filtered matrix (pretty):"
          echo "$FILTERED" | jq .
          echo "$FILTERED" > test_matrix.json
          echo "test_matrix=$FILTERED" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: test-matrix
          path: test_matrix.json

  prepare_matrix:
    needs: [flat_build, filter_test_matrix]
    if: ${{ needs.flat_build.result == 'success' && needs.filter_test_matrix.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
      build_urls: ${{ steps.read_url.outputs.build_urls }}
    steps:
      - name: Download legacy presigned URL artifacts (txt)
        uses: actions/download-artifact@v6
        with:
          pattern: presigned_url_*.txt
          path: presigned_urls_txt
          merge-multiple: true

      - name: Download current presigned URL artifacts (json)
        uses: actions/download-artifact@v6
        with:
          pattern: "*_presigned_urls.json"
          path: presigned_urls_json
          merge-multiple: true

      - name: Read matrix JSON
        id: matrix
        shell: bash
        run: |
          MATRIX='${{ needs.filter_test_matrix.outputs.test_matrix }}'
          echo "test_matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Read presigned URLs
        id: read_url
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const txtDir = 'presigned_urls_txt'
            const jsonDir = 'presigned_urls_json'
            const urls = {}
            const matrixObj = JSON.parse('${{ needs.filter_test_matrix.outputs.test_matrix }}')
            let images = []
            if (Array.isArray(matrixObj)) {
              images = matrixObj.map(x => x && x.image_name).filter(Boolean)
            } else if (matrixObj && typeof matrixObj === 'object') {
              images = Object.values(matrixObj).map(x => x && x.image_name).filter(Boolean)
            }

            if (fs.existsSync(txtDir)) {
              const txtEntries = fs.readdirSync(txtDir)
              for (const entry of txtEntries) {
                const fullPath = path.join(txtDir, entry)
                if (fs.statSync(fullPath).isFile()) {
                  const content = fs.readFileSync(fullPath, 'utf8').trim()
                  if (content) urls[entry] = content
                }
              }
            }

            if (fs.existsSync(jsonDir)) {
              const jsonEntries = fs.readdirSync(jsonDir).filter(name => name.endsWith('.json'))
              for (const entry of jsonEntries) {
                const fullPath = path.join(jsonDir, entry)
                if (!fs.statSync(fullPath).isFile()) continue
                const data = JSON.parse(fs.readFileSync(fullPath, 'utf8'))
                if (!data || typeof data !== 'object') continue
                const fileEntries = Object.entries(data)
                for (const image of images) {
                  const key = `presigned_url_${image}.txt`
                  if (urls[key]) continue
                  const preferred = fileEntries.find(([name]) =>
                    name.includes(image) &&
                    (name.endsWith('.tar.gz') || name.endsWith('.tar.bz2')) &&
                    !name.includes('vision')
                  )
                  const fallback = fileEntries.find(([name]) => name.includes(image))
                  const matched = preferred || fallback
                  if (matched && matched[1]) urls[key] = matched[1]
                }
              }
            }

            if (Object.keys(urls).length === 0) {
              throw new Error('No usable presigned URL artifacts were found.')
            }
            core.setOutput('build_urls', JSON.stringify(urls))

  trigger_lava:
    needs: prepare_matrix
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: Audioreach/meta-audioreach-test/.github/workflows/test.yml@master
    secrets: inherit
    with:
      build_matrix: ${{ needs.prepare_matrix.outputs.test_matrix }}
      build_urls: ${{ needs.prepare_matrix.outputs.build_urls }}
      testplan: pre-merge
